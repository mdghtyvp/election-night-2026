name: Update election results CSVs

on:
  # Primary trigger: an external cron service calls the workflow_dispatch API
  # every 2-3 minutes (see README). This is far more punctual than GitHub's
  # own scheduler.
  workflow_dispatch: {}

  # Fallback only. GitHub's scheduler is best-effort and can run 30+ minutes
  # late, but it costs nothing to leave on in case the external trigger dies.
  schedule:
    - cron: "7,22,37,52 * * * *"

# One run at a time, so two overlapping runs never fight over the same push.
concurrency:
  group: update-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch feed and write CSVs
        id: fetch
        # Don't stop the job if one race fails: still publish the others,
        # then fail the run at the end so the problem is visible.
        continue-on-error: true
        run: python fetch_races.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change in results, nothing to commit."
          else
            git commit -m "Update results $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash
            git push
          fi

      - name: Fail the run if any race failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "One or more races failed to update. See the 'Fetch feed' step log."
          exit 1
